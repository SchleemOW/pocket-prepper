modules:
  # ═══════════════════════════════════════════════════
  # LAYER 1 — SURVIVE
  # ═══════════════════════════════════════════════════

  - id: survival_general
    name: "Survival - General"
    description: "Psychology of survival, planning, priorities, stress management"
    sources:
      - type: wikipedia_articles
        titles: ["Survival skills", "Wilderness survival", "Hypothermia"]
        license: cc
        priority: P1
      - type: local_pdf
        path: "data/pdfs/FM21-76_SurvivalManual.pdf"
        title: "US Army FM 21-76 Survival Manual"
        license: public_domain
        priority: P1
      - type: local_pdf
        path: "data/pdfs/fm3-05-70.pdf"
        title: "US Army FM 3-05.70 Survival (2002)"
        license: public_domain
        priority: P1

  - id: survival_fire_shelter
    name: "Survival - Fire & Shelter"
    description: "Fire making, shelter construction, insulation, cold weather protection"
    sources:
      - type: wikipedia_articles
        titles: ["Fire making", "Bow drill", "Lean-to", "Debris hut", "Snow cave", "Bivouac shelter", "Tinder"]
        license: cc
        priority: P1
      - type: local_pdf
        path: "data/pdfs/FM21-76_SurvivalManual.pdf"
        title: "US Army FM 21-76 Survival Manual"
        license: public_domain
        priority: P1

  - id: survival_navigation
    name: "Survival - Navigation"
    description: "Celestial navigation, compass, map reading, natural navigation"
    sources:
      - type: wikipedia_articles
        titles: ["Navigation", "Celestial navigation", "Polaris", "Southern Cross", "Dead reckoning", "Orienteering", "Natural navigation"]
        license: cc
        priority: P1
      - type: local_pdf
        path: "data/pdfs/fm3-05-70.pdf"
        title: "US Army FM 3-05.70 Survival (2002)"
        license: public_domain
        priority: P1

  - id: survival_desert
    name: "Survival - Desert"
    description: "Desert water, heat management, solar stills, desert navigation"
    sources:
      - type: wikipedia_articles
        titles: ["Desert survival", "Solar still", "Dehydration", "Sandstorm", "Cactus"]
        license: cc
        priority: P1
      - type: local_pdf
        path: "data/pdfs/fm3-05-70.pdf"
        title: "US Army FM 3-05.70 Survival (2002)"
        license: public_domain
        priority: P1
      - type: local_pdf
        path: "data/pdfs/FM-90-3-Desert-Operations-24-August-1993.pdf"
        title: "US Army FM 90-3 Desert Operations"
        license: public_domain
        priority: P1

  - id: survival_cold
    name: "Survival - Cold Weather"
    description: "Hypothermia, frostbite, snow shelters, Arctic survival"
    sources:
      - type: wikipedia_articles
        titles: ["Hypothermia", "Frostbite", "Snow cave", "Igloo", "Ice fishing", "Snowshoe"]
        license: cc
        priority: P1
      - type: local_pdf
        path: "data/pdfs/fm3-05-70.pdf"
        title: "US Army FM 3-05.70 Survival (2002)"
        license: public_domain
        priority: P1

