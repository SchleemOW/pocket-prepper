  # ─────────────────────────────────────────────────────────────
  - id: cold_tests
    name: "Cold Weather Survival - Sub-zero"
    context: "Stranded in sub-zero conditions. Snow on the ground. No modern heating. Temperature -15°C."
    questions:
      - module: survival_cold
        question: "I'm soaking wet and it's -15°C. How do I avoid hypothermia?"
        required_concepts: ["dry", "insulation", "fire", "wind"]
        forbidden_concepts: ["hospital", "heater"]

      - module: survival_cold
        question: "How do I build a snow shelter to survive the night?"
        required_concepts: ["snow", "dig", "insulation", "ventilation"]
        forbidden_concepts: ["hotel", "cabin"]

      - module: survival_cold
        question: "My fingers and toes are numb and white. Is this frostbite? What do I do?"
        required_concepts: ["warm", "gradual", "skin"]
        forbidden_concepts: ["hospital", "emergency room"]

      - module: survival_cold
        question: "How do I find food in a frozen winter landscape?"
        required_concepts: ["trap", "ice fishing", "bark", "hunt"]
        forbidden_concepts: ["grocery", "store"]

      - module: survival_cold
        question: "How do I melt snow for drinking water safely?"
        required_concepts: ["fire", "melt", "boil", "container"]
        forbidden_concepts: ["tap", "bottle"]

