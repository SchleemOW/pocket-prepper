        required_concepts: ["bamboo", "palm", "frame", "elevated"]
        forbidden_concepts: ["contractor", "buy"]

      - module: medicine_trauma
        question: "Many people have coral cuts and saltwater wounds that are getting infected. How do we treat them?"
        required_concepts: ["clean", "fresh water", "honey", "bandage"]
