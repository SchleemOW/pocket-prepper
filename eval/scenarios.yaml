  # ─────────────────────────────────────────────────────────────
  # CROSS-SCENARIO: Real-world composite situations
  # ─────────────────────────────────────────────────────────────
  - id: composite_urban_europe
    name: "Composite - Urban Europe Winter"
    context: "War has destroyed infrastructure in a European city. It is January, -5°C. A group of 30 survivors in a partially destroyed apartment building. No electricity, no water, no gas, no shops."
