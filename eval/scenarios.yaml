# ═══════════════════════════════════════════════════════════════
# POCKET PREPPER - EVALUATION SCENARIOS v2
# ~10 questions per module area, diverse geographies and situations
# ═══════════════════════════════════════════════════════════════

scenarios:

  # ─────────────────────────────────────────────────────────────
  # SURVIVAL - GENERAL
  # ─────────────────────────────────────────────────────────────
  - id: survival_general_tests
    name: "Survival General - Mixed Scenarios"
    context: "Complete infrastructure collapse. No emergency services, no supply chains, no communication. You are alone with no equipment."
    questions:
      - module: survival_general
        question: "I just survived a disaster and I'm panicking. How do I calm down and think clearly?"
        required_concepts: ["stress", "plan", "priorities", "calm"]
        forbidden_concepts: ["therapist", "call someone"]

      - module: survival_general
        question: "What should my first priorities be in the first 24 hours after a collapse?"
        required_concepts: ["water", "shelter", "fire"]
        forbidden_concepts: ["call 911", "emergency services"]

      - module: survival_general
        question: "How do I signal for rescue if I'm stranded?"
        required_concepts: ["fire", "smoke", "signal", "mirror"]
        forbidden_concepts: ["cell phone", "call"]

      - module: survival_general
        question: "I'm trapped in a building after an earthquake. What do I do?"
        required_concepts: ["cover", "debris", "breathe", "signal"]
        forbidden_concepts: ["call emergency", "fire department"]

      - module: survival_general
        question: "How do I prioritize survival needs? What kills first?"
        required_concepts: ["exposure", "water", "food", "shelter"]
        forbidden_concepts: ["hospital"]

  # ─────────────────────────────────────────────────────────────
  # SURVIVAL - FIRE & SHELTER
  # ─────────────────────────────────────────────────────────────
  - id: fire_shelter_tests
    name: "Fire & Shelter - Mixed Climates"
    context: "No modern tools or supplies available. Must use natural materials and improvisation."
    questions:
      - module: survival_fire_shelter
        question: "How do I start a fire with no matches, lighter, or modern tools?"
        required_concepts: ["friction", "bow drill", "tinder"]
        forbidden_concepts: ["buy", "store"]

      - module: survival_fire_shelter
        question: "It's raining heavily. How do I build a waterproof shelter quickly?"
        required_concepts: ["lean-to", "leaves", "branches", "angle"]
        forbidden_concepts: ["tent", "buy", "hardware store"]

      - module: survival_fire_shelter
        question: "How do I keep a fire going overnight without constantly feeding it?"
        required_concepts: ["log", "bank", "coal", "slow"]
        forbidden_concepts: ["gas", "lighter fluid"]

      - module: survival_fire_shelter
        question: "What are the best natural materials for insulating a shelter?"
        required_concepts: ["leaves", "grass", "debris", "thick"]
        forbidden_concepts: ["insulation foam", "buy"]

      - module: survival_fire_shelter
        question: "How do I build a shelter that protects from both rain and cold wind?"
        required_concepts: ["wind", "wall", "waterproof", "insulation"]
        forbidden_concepts: ["contractor", "hardware"]

      - module: survival_fire_shelter
        question: "What mistakes do people make when building fires that waste energy?"
        required_concepts: ["wet wood", "tinder", "wind"]
        forbidden_concepts: ["buy firewood"]

  # ─────────────────────────────────────────────────────────────
  # SURVIVAL - DESERT
  # ─────────────────────────────────────────────────────────────
  - id: desert_tests
    name: "Desert Survival - Hot Arid Regions"
    context: "Stranded in a hot desert. Temperatures 40-50°C by day, 5-15°C at night. Almost no vegetation. No infrastructure."
    questions:
      - module: survival_desert
        question: "It's 45°C and I have no water. How do I find water in the desert?"
        required_concepts: ["dig", "solar still", "dew", "vegetation"]
        forbidden_concepts: ["tap water", "store", "buy"]

      - module: survival_desert
        question: "Should I travel during the day or night in the desert?"
        required_concepts: ["night", "heat", "conserve", "shade"]
        forbidden_concepts: ["car", "air conditioning"]

      - module: survival_desert
        question: "How do I build a solar still to collect water?"
        required_concepts: ["hole", "plastic", "container", "condensation", "sun"]
        forbidden_concepts: ["buy", "store"]

      - module: survival_desert
        question: "How do I protect myself from heat stroke in extreme heat?"
        required_concepts: ["shade", "rest", "water", "cover"]
        forbidden_concepts: ["hospital", "air conditioning"]

      - module: survival_desert
        question: "What can I eat in a desert environment?"
        required_concepts: ["insects", "reptile", "cactus"]
        forbidden_concepts: ["grocery", "restaurant"]

      - module: survival_desert
        question: "How do I navigate in a desert with no landmarks?"
        required_concepts: ["sun", "star", "shadow", "direction"]
        forbidden_concepts: ["GPS", "phone"]

      - module: survival_desert
        question: "A sandstorm is approaching. What do I do?"
        required_concepts: ["cover", "face", "breathe", "shelter"]
        forbidden_concepts: ["building", "car"]

  # ─────────────────────────────────────────────────────────────
